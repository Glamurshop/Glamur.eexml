name: Auto Update XML

on:
  schedule:
    - cron: "*/30 * * * *"   # kas 30 min
  workflow_dispatch:        # leidžia paleisti ranka

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas lxml

      - name: Run script
        run: python test50.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update XML" || echo "No changes"
          git push
